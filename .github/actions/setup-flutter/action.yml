name: Configurar Flutter
description: Instala SDK fixado e restaura caches por arquitetura.
inputs:
  version:
    description: Tag oficial do Flutter
    required: true
runs:
  using: composite
  steps:
    - uses: actions/cache@v4
      id: sdk
      with:
        path: ${{ runner.temp }}/flutter
        key: flutter-${{ runner.os }}-${{ runner.arch }}-${{ inputs.version }}
    - if: steps.sdk.outputs.cache-hit != 'true'
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
      run: git clone --depth 1 --branch "$VERSION" https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
    - shell: bash
      run: |
        if [[ "$RUNNER_OS" == Windows ]]; then
          echo "$(cygpath -w "$RUNNER_TEMP/flutter/bin")" >> "$GITHUB_PATH"
          echo "PUB_CACHE=$(cygpath -w "$RUNNER_TEMP/pub-cache")" >> "$GITHUB_ENV"
        else
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
          echo "PUB_CACHE=$RUNNER_TEMP/pub-cache" >> "$GITHUB_ENV"
        fi
    - uses: actions/cache@v4
      with:
        path: ${{ runner.temp }}/pub-cache
        key: pub-${{ runner.os }}-${{ runner.arch }}-${{ inputs.version }}-${{ hashFiles('**/pubspec.yaml', '**/pubspec.lock') }}
        restore-keys: |
          pub-${{ runner.os }}-${{ runner.arch }}-${{ inputs.version }}-
    - shell: bash
      run: |
        flutter config --no-analytics
        flutter --version

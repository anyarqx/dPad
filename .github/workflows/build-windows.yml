name: Bundle Windows
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Instalar Flutter estável fixado
        shell: pwsh
        run: |
          git clone --depth 1 --branch 3.47.5 https://github.com/flutter/flutter.git "$env:RUNNER_TEMP/flutter"
          "$env:RUNNER_TEMP/flutter/bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Compilar e verificar bundle
        shell: pwsh
        run: ./tools/build-windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: DoPapelAoDigital-windows-x64
          path: dist/DoPapelAoDigital-windows-x64.zip
          if-no-files-found: error

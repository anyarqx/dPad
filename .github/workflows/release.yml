name: Distribuição
on:
  workflow_dispatch:
    inputs:
      linux_x64:
        description: linux-x64
        type: boolean
        default: false
      linux_arm64:
        description: linux-arm64
        type: boolean
        default: false
      windows_x64:
        description: windows-x64
        type: boolean
        default: false
      windows_arm64:
        description: windows-arm64
        type: boolean
        default: false
      android_armv7:
        description: android-armv7
        type: boolean
        default: false
      android_arm64:
        description: android-arm64
        type: boolean
        default: false
      android_x64:
        description: android-x64
        type: boolean
        default: false
      web:
        description: web
        type: boolean
        default: false
      tag:
        description: Tag de release existente (opcional; vazio gera apenas artifacts)
        type: string
        required: false
permissions:
  contents: read
concurrency:
  group: distribution-${{ github.ref }}
  cancel-in-progress: false
env:
  FLUTTER_VERSION: '3.47.5'
jobs:
  select:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
      any: ${{ steps.select.outputs.any }}
    steps:
      - id: select
        shell: bash
        env:
          INPUTS: ${{ toJSON(inputs) }}
        run: |
          python3 - <<'PYTHON'
          import json, os
          options = json.loads(os.environ['INPUTS'] or '{}') or {}
          entries = [('linux_x64', {'id': 'linux-x64', 'os': 'ubuntu-22.04', 'command': 'bash tools/build/linux.sh x64', 'platform': 'linux'}), ('linux_arm64', {'id': 'linux-arm64', 'os': 'ubuntu-22.04-arm', 'command': 'bash tools/build/linux.sh arm64', 'platform': 'linux'}), ('windows_x64', {'id': 'windows-x64', 'os': 'windows-2022', 'command': './tools/build/windows.ps1 -Architecture x64', 'platform': 'windows'}), ('windows_arm64', {'id': 'windows-arm64', 'os': 'windows-11-arm', 'command': './tools/build/windows.ps1 -Architecture arm64', 'platform': 'windows'}), ('android_armv7', {'id': 'android-armv7', 'os': 'ubuntu-24.04', 'command': 'bash tools/build/android.sh armv7', 'platform': 'android'}), ('android_arm64', {'id': 'android-arm64', 'os': 'ubuntu-24.04', 'command': 'bash tools/build/android.sh arm64', 'platform': 'android'}), ('android_x64', {'id': 'android-x64', 'os': 'ubuntu-24.04', 'command': 'bash tools/build/android.sh x64', 'platform': 'android'}), ('web', {'id': 'web', 'os': 'ubuntu-24.04', 'command': 'bash tools/build/web.sh', 'platform': 'web'})]
          selected = [m for key, m in entries if options.get(key) is True]
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              print('matrix=' + json.dumps({'include': selected}), file=out)
              print('any=' + str(bool(selected)).lower(), file=out)
          PYTHON
  verify:
    needs: select
    if: needs.select.outputs.any == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-flutter
        with:
          version: ${{ env.FLUTTER_VERSION }}
      - working-directory: apps/server
        run: |
          dart pub get
          dart analyze
          dart test
      - working-directory: apps/client
        run: |
          flutter pub get
          flutter analyze
      - run: python3 tools/test-client.py
  build:
    needs: [select, verify]
    if: needs.select.outputs.any == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev
      - if: matrix.platform == 'android'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: ./.github/actions/setup-flutter
        with:
          version: ${{ env.FLUTTER_VERSION }}
      - name: Assinatura Android
        if: matrix.platform == 'android'
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -eu
          : "${KEYSTORE_BASE64:?}" "${KEYSTORE_PASSWORD:?}" "${KEY_ALIAS:?}" "${KEY_PASSWORD:?}"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > apps/client/android/app/release.jks
          printf 'storeFile=release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > apps/client/android/key.properties
      - name: Compilar e empacotar (Linux, Android e Web)
        if: matrix.platform != 'windows'
        shell: bash
        run: ${{ matrix.command }}
      - name: Compilar e empacotar (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: ${{ matrix.command }}
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.id }}
          path: dist/DoPapelAoDigital-${{ matrix.id }}.*
          if-no-files-found: error
          retention-days: 14
  publish:
    needs: build
    if: inputs.tag != ''
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: dist-*
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum -- DoPapelAoDigital-* > SHA256SUMS.txt
      - if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/DoPapelAoDigital-*
      - name: Publicar
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          shopt -s nullglob
          new_files=(dist/DoPapelAoDigital-*)
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' > /tmp/release-assets
          while IFS= read -r name; do
            case "$name" in
              DoPapelAoDigital-*.zip|DoPapelAoDigital-*.tar.gz|DoPapelAoDigital-*.apk)
                if [[ ! -f "dist/$name" ]]; then
                  gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "$name" --dir dist
                fi;;
            esac
          done < /tmp/release-assets
          (cd dist && sha256sum -- DoPapelAoDigital-* > SHA256SUMS.txt)
          gh release upload "$TAG" "${new_files[@]}" dist/SHA256SUMS.txt --clobber --repo "$GITHUB_REPOSITORY"

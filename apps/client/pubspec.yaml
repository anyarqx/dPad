name: dPad
description: Organização documental e rotinas escolares locais.
publish_to: none
version: 0.1.0+1
environment:
  sdk: ^3.13.0
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  forui: ^0.27.7
  flutter_riverpod: ^3.0.0
  go_router: ^17.0.0
  http: ^1.5.0
  file_picker: ^10.3.0
  pdfrx: ^2.2.0
  crop_your_image: ^2.0.0
  pdf: ^3.11.3
  image: ^4.5.4
  shared_preferences: ^2.5.3
  path_provider: ^2.1.5
  path: ^1.9.1
  uuid: ^4.5.2
  intl: any
  material_ui: ^1.8.0
  window_manager: ^0.5.1
  flutter_svg: ^2.3.0
  cupertino_icons: ^1.0.8
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  shared_preferences_linux: ^2.4.1
flutter:
  uses-material-design: true
  assets:
    - assets/logo.svg
    - assets/app-icon.png
    - assets/data/br-localities.json
